<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ストループ課題（授業課題・データ回収版）</title>
  <script src="https://unpkg.com/jspsych@8.3.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@2.2.0"></script>
  <script src="https://unpkg.com/@jspsych/extension-pipe@0.2.0"></script>
  <link href="https://unpkg.com/jspsych@8.3.0/css/jspsych.css" rel="stylesheet" type="text/css">
  <style>
    body { background: #fafafa; color: #1a1a1a; font-family: sans-serif; }
    /* Hide the blinking text caret, including when caret browsing is enabled.
       This does not disable keyboard events or text selection. */
    body, body * { caret-color: transparent !important; }
    .jspsych-content { max-width: 780px; }
    .prompt { color: #424242; font-size: 18px; margin-top: 16px; }
    .stimulus { font-size: 92px; font-weight: 700; line-height: 1.5; }
    .small { font-size: 14px; color: #666; }
    .instructions { text-align: left; line-height: 1.9; font-size: 18px; }
    .task-name { font-size: 22px; font-weight: 700; }
    kbd { background: #eee; border: 1px solid #aaa; padding: 3px 8px; border-radius: 4px; }
    button.save { padding: 12px 24px; font-size: 18px; cursor: pointer; }
    .completion-code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: clamp(22px, 5vw, 36px); letter-spacing: .07em; padding: 15px; border: 2px solid #225d46; background: #effaf3; border-radius: 8px; user-select: all; }
    .status { margin: 40px auto; padding: 20px; max-width: 680px; line-height: 1.8; }
    .error { color: #9d2020; }
    .copy-status { min-height: 1.6em; }
  </style>
</head>
<body>
<script>
'use strict';
/*
 * Class experiment with DataPipe. The experiment ID is a PUBLIC identifier,
 * not a password. Never store student names or student numbers in the CSV.
 * Confirm a successful upload before telling students their completion code.
 * Each completed session saves one CSV; test submissions should be done in
 * a separate DataPipe experiment (or excluded from the course dataset).
 */
const VERSION = 'class-datapipe-1.1';
const DATAPIPE_EXPERIMENT_ID = '9n8bETQmN7mA';

function randomHex(nBytes) {
  const buffer = new Uint8Array(nBytes);
  if (!window.crypto || !window.crypto.getRandomValues) {
    throw new Error('Secure random number generation is unavailable. Open this experiment over HTTPS.');
  }
  window.crypto.getRandomValues(buffer);
  return Array.from(buffer, b => b.toString(16).padStart(2, '0')).join('');
}

const PARTICIPANT_ID = randomHex(12);
const COMPLETION_CODE = randomHex(8).toUpperCase();
const GROUP = Math.random() < 0.5 ? 'word' : 'ink';
const TASK_JP = GROUP === 'word' ? '文字読み' : '色判断';

function showStatus(html) {
  // Display the final message using the same DOM node as jsPsych.
  document.body.innerHTML = '<main class="status">' + html + '</main>';
}
function attachCopyButton() {
  const button = document.getElementById('copy-code');
  if (!button) return;
  button.addEventListener('click', async () => {
    const status = document.getElementById('copy-status');
    try {
      await navigator.clipboard.writeText(COMPLETION_CODE);
      status.textContent = 'コピーしました。Canvasの提出欄に貼り付けてください。';
    } catch (error) {
      status.textContent = 'コピーできない場合は、表示されたコードを手入力してください。';
    }
  });
}

// Keep the final save result and the jsPsych finish event separate.
// The DataPipe extension and jsPsych may run their callbacks in either order.
// One shared renderer prevents a late callback from overwriting the code.
let uploadResult = null;
let experimentFinished = false;

function hasAllRequiredTrials() {
  const mainRows = jsPsych.data.get().filter({phase: 'main'}).values();
  const congruent = mainRows.filter(r => r.congruency === 'congruent').length;
  const incongruent = mainRows.filter(r => r.congruency === 'incongruent').length;
  const participantMatches = mainRows.every(r =>
    r.participant_id === PARTICIPANT_ID &&
    r.completion_code === COMPLETION_CODE &&
    r.group === GROUP
  );
  return mainRows.length === 80 && congruent === 40 &&
    incongruent === 40 && participantMatches;
}

function renderFinalScreen() {
  if (!experimentFinished) return;
  if (uploadResult === null) {
    showStatus('<h2>実験データを送信しています</h2>' +
      '<p>保存が完了するまで、この画面を閉じないでください。</p>');
    return;
  }
  const completed = hasAllRequiredTrials();
  if (uploadResult.ok === true && completed) {
    showStatus(`
      <h2>実験が完了しました</h2>
      <p>データの送信が成功しました。次の完了コードをCanvasの課題に提出してください。</p>
      <div class="completion-code" id="completion-code">${COMPLETION_CODE}</div>
      <p><button class="save" id="copy-code" type="button">完了コードをコピー</button></p>
      <p class="small copy-status" id="copy-status"></p>
      <p>コードを提出したら、このページを閉じて構いません。</p>
      <p class="small">問い合わせ用参加者ID：${PARTICIPANT_ID}</p>
    `);
    attachCopyButton();
  } else {
    showStatus(`
      <h2 class="error">完了を確認できませんでした</h2>
      <p>${completed ? 'データ送信が正常に完了したことを確認できませんでした。' : '必要な本試行データが揃っていません。'}</p>
      <p>Canvasに完了コードを提出せず、担当教員に連絡してください。</p>
      <p>再実施は教員の指示があるまで控えてください。</p>
      <p class="small">問い合わせ用参加者ID：${PARTICIPANT_ID}</p>
    `);
  }
}

const jsPsych = initJsPsych({
  on_finish: function () {
    experimentFinished = true;
    renderFinalScreen();
  },
  extensions: [{
    type: jsPsychExtensionPipe,
    params: {
      experiment_id: DATAPIPE_EXPERIMENT_ID,
      filename: () => `stroop_${PARTICIPANT_ID}.csv`,
      format: 'csv',
      stream: false,
      wait_message: '<p>データを送信しています。ページを閉じないでください。</p>',
      done_message: '<p>送信結果を確認しています。ページを閉じないでください。</p>',
      on_save: (result) => {
        uploadResult = result || {ok: false};
        renderFinalScreen();
      }
    }
  }]
});
jsPsych.data.addProperties({
  participant_id: PARTICIPANT_ID,
  completion_code: COMPLETION_CODE,
  group: GROUP,
  task_name: TASK_JP,
  experiment_version: VERSION
});

const timeline = [];
const intro = {
  type: jsPsychHtmlKeyboardResponse,
  stimulus: `<div class="instructions">
    <h2>ストループ課題（授業課題）</h2>
    <p>この実験では、文字が1つずつ表示されます。<strong>${TASK_JP}</strong>に回答してください。</p>
    <p class="task-name">${GROUP === 'word' ? '文字の意味する色' : '文字が表示されている色'}を判断します。</p>
    <p>赤なら <kbd>F</kbd> キー、青なら <kbd>J</kbd> キーを押してください。</p>
    <p>できるだけ速く、正確に回答してください。</p>
    <p>まず12試行の練習を行い、その後80試行の本番を行います。</p>
    <p>PCと物理キーボードを使い、周囲が静かな場所で実施してください。</p>
    <p class="small">実験への参加は任意です。収集データは授業の分析演習に使用し、学籍番号・氏名は収集しません。完了コードは成績確認のためCanvasの提出情報と照合されます。分析用データを配布する際には完了コードを削除します。反応の速さや正答率は成績に影響しません。途中で中断できますが、完了コードは発行されません。</p>
    <p>上記を確認し、参加する場合はスペースキーで開始してください。</p>
  </div>`,
  choices: [' '],
  data: {phase: 'instruction'}
};
timeline.push(intro);

function makeStimuli(repetitions) {
  const pairs = [
    {word: '赤', ink: 'red', congruency: 'congruent'},
    {word: '青', ink: 'blue', congruency: 'congruent'},
    {word: '赤', ink: 'blue', congruency: 'incongruent'},
    {word: '青', ink: 'red', congruency: 'incongruent'}
  ];
  const all = [];
  for (let k = 0; k < repetitions; k++) {
    for (const item of pairs) all.push({...item});
  }
  return jsPsych.randomization.shuffle(all);
}

function makeTrial(item, phase, block, trialIndex) {
  const expectedColor = GROUP === 'word' ? (item.word === '赤' ? 'red' : 'blue') : item.ink;
  const correctKey = expectedColor === 'red' ? 'f' : 'j';
  const colorCode = item.ink === 'red' ? '#d32f2f' : '#1565c0';
  const fixation = {
    type: jsPsychHtmlKeyboardResponse,
    stimulus: '<div style="font-size:48px">+</div>',
    choices: 'NO_KEYS',
    trial_duration: 400,
    data: {phase: 'fixation'}
  };
  const response = {
    type: jsPsychHtmlKeyboardResponse,
    stimulus: `<div class="stimulus" style="color:${colorCode}">${item.word}</div>`,
    prompt: `<p class="prompt">${TASK_JP}　　F = 赤　／　J = 青</p>`,
    choices: ['f','j'],
    trial_duration: 2500,
    post_trial_gap: 250,
    data: {
      phase: phase,
      block: block,
      trial_in_block: trialIndex,
      word: item.word,
      ink: item.ink,
      congruency: item.congruency,
      correct_response: correctKey
    },
    on_finish: function(data) {
      data.correct = data.response !== null &&
        jsPsych.pluginAPI.compareKeys(data.response, data.correct_response);
      data.timeout = data.response === null;
    }
  };
  timeline.push(fixation, response);
  if (phase === 'practice') {
    timeline.push({
      type: jsPsychHtmlKeyboardResponse,
      stimulus: function () {
        const last = jsPsych.data.get().last(1).values()[0];
        return `<div style="font-size:32px;color:${last.correct ? '#237a4b' : '#a32222'}">` +
          (last.correct ? '正解' : '不正解') + '</div>';
      },
      choices: 'NO_KEYS',
      trial_duration: 450,
      data: {phase: 'feedback'}
    });
  }
}

const practice = makeStimuli(3); // 4 unique pairings x 3 = 12 trials
practice.forEach((t, i) => makeTrial(t, 'practice', 0, i + 1));
timeline.push({
  type: jsPsychHtmlKeyboardResponse,
  stimulus: '<h2>練習終了</h2><p>これから本番です。正解・不正解の表示はありません。</p><p>スペースキーで開始</p>',
  choices: [' '],
  data: {phase: 'instruction'}
});

for (let block = 1; block <= 2; block++) {
  const mainTrials = makeStimuli(10); // 40 per block, 80 total, 40 congruent / 40 incongruent
  mainTrials.forEach((t, i) => makeTrial(t, 'main', block, i + 1));
  if (block === 1) {
    timeline.push({
      type: jsPsychHtmlKeyboardResponse,
      stimulus: '<h2>半分終了です</h2><p>休憩して構いません。</p><p>スペースキーで後半を開始してください。</p>',
      choices: [' '],
      data: {phase: 'break'}
    });
  }
}
jsPsych.run(timeline);
</script>
</body>
</html>
